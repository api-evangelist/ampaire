description: Ampaire is a Long Beach, California electric aviation company that develops
  hybrid-electric propulsion systems for aircraft. Its AmpDrive powertrain retrofits
  and powers regional aircraft, and the company reports more than 30,000 flight miles
  with a stated goal of cutting fuel consumption, maintenance costs, and noise. Ampaire
  is backed by Techstars and has worked with partners including NASA and ARPA-E. The
  company currently exposes no public API, developer portal, or documentation surface;
  this profile is maintained in the API Evangelist network as a company record awaiting
  any future developer program.
